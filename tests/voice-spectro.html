<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quark voice: spectrograms</title>
<style>
  body { background: #05070c; color: #cfe0f5; font: 12px/1.4 ui-monospace, Menlo, monospace; margin: 0; padding: 10px; }
  .panel { margin: 0 0 10px; }
  .panel h3 { margin: 0 0 3px; font-size: 12px; color: #7fe9ff; font-weight: 600; }
  canvas { display: block; width: 100%; max-width: 780px; background: #000; border: 1px solid #1c2535; }
  .legend { color: #7d8aa0; margin: 2px 0 12px; }
</style>
</head>
<body>
<div class="legend">Spectrogram: time runs left to right, frequency 0 to 4 kHz bottom to top, brighter = louder. White / cyan / magenta lines are the planned vowel resonances F1 / F2 / F3 (pet voice only).</div>
<div id="out"></div>
<script type="module">
import { createRobotVoice } from '../js/robotvoice.js';
const SR = 44100;
const q = new URLSearchParams(location.search);
// panels: "style|mood|text;style|mood|text"
const spec = (q.get('p') || 'voice|neutral|hello there;chirp|neutral|hello there').split(';').map((s) => s.split('|'));
const out = document.getElementById('out');
window.__spectro = { done: false, panels: [] };

function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang), half = len >> 1;
    for (let i = 0; i < n; i += len) { let cr = 1, ci = 0; for (let k = 0; k < half; k++) { const a = i + k, b = a + half; const vr = re[b] * cr - im[b] * ci, vi = re[b] * ci + im[b] * cr; re[b] = re[a] - vr; im[b] = im[a] - vi; re[a] += vr; im[a] += vi; const nc = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nc; } }
  }
}
const colour = (v) => { const t = Math.max(0, Math.min(1, v)); const r = Math.min(255, Math.round(255 * Math.pow(t, 0.8) * 1.4)), g = Math.round(255 * Math.pow(t, 2.2)), b = Math.round(160 * Math.sin(Math.PI * Math.min(1, t * 1.1)) * (1 - t * 0.6)); return `rgb(${r},${g},${b})`; };

async function panel([style, mood, text]) {
  const ctx = new OfflineAudioContext(1, SR * 6, SR);
  const v = createRobotVoice({ ctx, offline: true });
  v.setStyle(style);
  const ms = v.robotSpeak(text, { mood, intensity: 85 });
  const plan = v.plan(text, mood, 85);
  const buf = await ctx.startRendering();
  const x = buf.getChannelData(0);
  const dur = Math.min(5.9, ms / 1000 + 0.25), N = 1024, hop = 256, frames = Math.floor((dur * SR - N) / hop);
  const W = 780, H = 260, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const mags = [];
  let peak = 1e-9;
  for (let f = 0; f < frames; f++) {
    const re = new Float64Array(N), im = new Float64Array(N);
    for (let i = 0; i < N; i++) re[i] = (x[f * hop + i + Math.round(SR * 0.06)] || 0) * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)));
    fft(re, im);
    const m = new Float64Array(N / 2); for (let i = 0; i < m.length; i++) { m[i] = Math.hypot(re[i], im[i]); if (m[i] > peak) peak = m[i]; }
    mags.push(m);
  }
  const maxBin = Math.floor(4000 * N / SR);
  for (let f = 0; f < frames; f++) {
    const x0 = Math.floor(f * W / frames), x1 = Math.ceil((f + 1) * W / frames);
    for (let b = 0; b < maxBin; b++) {
      const d = 20 * Math.log10(mags[f][b] / peak + 1e-9);                          // 0 dB at the loudest point, down to -60
      c.fillStyle = colour((d + 60) / 60);
      const y1 = H - Math.floor(b * H / maxBin), y0 = H - Math.ceil((b + 1) * H / maxBin);
      c.fillRect(x0, y0, x1 - x0, y1 - y0 + 1);
    }
  }
  if (plan.score) {
    const draw = (pts, col) => { c.strokeStyle = col; c.lineWidth = 1; c.beginPath(); let started = false; for (const [t, hz] of pts) { const X = (t / dur) * W, Y = H - (Math.min(4000, hz) / 4000) * H; if (!started) { c.moveTo(X, Y); started = true; } else c.lineTo(X, Y); } c.stroke(); };
    // only draw formants while the voice is on (otherwise the lines wander through silence)
    const on = (t) => { const p = plan.score.voice.p; let val = 0; for (let i = 0; i < p.length - 1; i++) if (t >= p[i][0] && t <= p[i + 1][0]) { val = p[i][1] + (p[i + 1][1] - p[i][1]) * (t - p[i][0]) / Math.max(1e-6, p[i + 1][0] - p[i][0]); } return val; };
    const track = (name) => plan.score[name].p;
    const lineOn = (pts, col) => { c.strokeStyle = col; c.lineWidth = 1.2; let pen = false; c.beginPath(); for (let t = 0; t < dur; t += 0.004) { let hz = pts[0][1]; for (let i = 0; i < pts.length - 1; i++) if (t >= pts[i][0] && t <= pts[i + 1][0]) { const k = (t - pts[i][0]) / Math.max(1e-6, pts[i + 1][0] - pts[i][0]); hz = pts[i][1] * Math.pow(pts[i + 1][1] / pts[i][1], k); } const vis = on(t) > 0.05 * 1; const X = (t / dur) * W, Y = H - (Math.min(4000, hz) / 4000) * H; if (vis) { if (!pen) { c.moveTo(X, Y); pen = true; } else c.lineTo(X, Y); } else pen = false; } c.stroke(); };
    lineOn(track('F1'), '#ffffff'); lineOn(track('F2'), '#00e5ff'); lineOn(track('F3'), '#ff4fd8');
    lineOn(plan.score.f0.p, '#ffd34d');
  }
  c.fillStyle = '#9fb0c8'; c.font = '10px monospace';
  for (const hz of [1000, 2000, 3000]) { const Y = H - (hz / 4000) * H; c.fillRect(0, Y, 6, 1); c.fillText(hz / 1000 + 'k', 8, Y + 3); }
  for (let s = 0; s < dur; s += 0.5) { const X = (s / dur) * W; c.fillRect(X, H - 6, 1, 6); c.fillText(s.toFixed(1) + 's', X + 2, H - 8); }
  const wrap = document.createElement('div'); wrap.className = 'panel';
  wrap.innerHTML = `<h3>${style} · ${mood} · "${text}" · ${ms} ms</h3>`; wrap.appendChild(cv); out.appendChild(wrap);
  window.__spectro.panels.push({ style, mood, text, ms });
}
for (const s of spec) await panel(s);
out.insertAdjacentHTML('beforeend', '<div class="legend">yellow line = planned pitch (f0), shown for the pet voice</div>');
window.__spectro.done = true;
</script>
</body>
</html>
